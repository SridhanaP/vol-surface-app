name: Daily options snapshot

on:
  schedule:
    # 19:30 UTC = 3:30 pm New York in summer, 2:30 pm in winter.
    # Runs before the 4 pm close so Yahoo still shows live bid/ask quotes.
    - cron: "30 19 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today is not a trading day"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy scipy

      - name: Collect snapshot
        run: python collector.py ${{ inputs.force && '--force' || '' }}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "Options snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
